<h1>LIMITLESS · 5콤보부터 정답마다 +20점</h1>
<p>정답·판 교체에는 유지, 선택 취소·오답에는 초기화. 흰색/회색 UI와 원래 컬러 블록은 유지했다.<br>
390×844 CSS px/DPR 2. Android 프레임 모의검사이며 실제 기기 화면은 아니다. 4/6 반복 보드·시간 고정의 검사 조건이다.</p>
